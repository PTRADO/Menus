<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6E8">
<meta name="description" content="La Popote — quatre semaines de vrais dîners familiaux, simples, rapides et riches en protéines.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>La Popote — 4 semaines de menus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FFF6E8; --card:#FFFDF7; --ink:#3F2E23; --muted:#7A6759; --line:#EBDCC6;
  --coral:#EA5228; --coral-d:#C8431F; --sun:#FFC64B; --leaf:#3E9E63; --leaf-d:#2F7F4E;
  --berry:#C2334D; --sky:#5FA8DC;
  --disp:'Baloo 2','Comic Sans MS',cursive; --body:'Nunito','Trebuchet MS',sans-serif;
  --sh:0 4px 0 var(--ink); --sh-sm:0 3px 0 var(--ink);
  --r:20px; --nav:72px; --top:96px;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:
  radial-gradient(1100px 480px at 88% -120px,rgba(255,198,75,.22),transparent 60%),
  radial-gradient(900px 460px at -8% 60px,rgba(244,99,60,.12),transparent 55%),
  radial-gradient(rgba(63,46,35,.05) 1.5px,transparent 1.5px) 0 0/26px 26px,
  var(--cream);
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--disp);font-weight:800;letter-spacing:-.01em;line-height:1.12}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.eyebrow{font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--coral-d)}
.shell{max-width:660px;margin:0 auto;padding:0 16px 34px}

/* ================= header ================= */
.top{position:sticky;top:0;z-index:40;background:rgba(255,246,232,.94);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:2px solid var(--ink)}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 16px 0}
.tbar{display:flex;align-items:center;gap:14px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo svg{width:34px;height:34px;flex:0 0 auto}
.lname{font-family:var(--disp);font-weight:800;font-size:21px;line-height:1;white-space:nowrap}
.lname small{display:block;font-family:var(--body);font-weight:800;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.gear{margin-left:auto;flex:0 0 42px;height:42px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:var(--sh-sm);
  transition:transform .15s,box-shadow .15s}
.gear:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}

/* desktop nav */
.dnav{display:none;align-items:center;gap:6px;margin-left:auto}
.dnav button{position:relative;display:flex;align-items:center;gap:8px;padding:9px 15px;
  border-radius:999px;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink);
  border:2px solid transparent;transition:background .15s,transform .15s}
.dnav button:hover{background:rgba(63,46,35,.07)}
.dnav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.dnav button[aria-current="true"]{background:var(--sun);border-color:var(--ink);
  box-shadow:var(--sh-sm)}
.dnav button[aria-current="true"]:hover{background:#F5B93A}

/* week pills */
.weeks{display:flex;align-items:center;gap:8px;padding-bottom:12px}
.wk{flex:1;position:relative;padding:9px 6px;border:2px solid var(--ink);border-radius:999px;
  background:var(--card);font-family:var(--disp);font-weight:700;font-size:14px;
  transition:transform .15s,background .15s,box-shadow .15s}
.wk:hover{background:#FFF1D6}
.wk[aria-current="true"]{background:var(--sun);box-shadow:var(--sh-sm)}
.wk:active{transform:translateY(2px)}
.wk i{font-style:normal}
.wk b{display:none;font-weight:700}
.wk em{position:absolute;top:-4px;right:2px;width:14px;height:14px;border-radius:50%;
  background:var(--leaf);border:2px solid var(--ink);display:none;
  color:#fff;font-style:normal;font-size:8px;line-height:10px;text-align:center}
.wk[data-full="1"] em{display:block}
.wk em::before{content:"✓"}
.wtitle{display:none;margin-left:auto;font-family:var(--disp);font-weight:700;font-size:15px;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}

/* ================= mobile nav ================= */
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:2px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.mnav button{flex:1;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);position:relative;transition:color .15s}
.mnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.mnav button .t{font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.02em}
.mnav button[aria-current="true"]{color:var(--coral-d)}
.mnav button[aria-current="true"] svg{transform:translateY(-1px) scale(1.08)}
.mnav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:26%;right:26%;
  height:3.5px;border-radius:0 0 4px 4px;background:var(--coral)}
.badge{position:absolute;top:3px;right:calc(50% - 24px);background:var(--berry);color:#fff;
  font-family:var(--disp);font-weight:700;font-size:10px;min-width:17px;height:17px;
  border-radius:9px;border:1.5px solid var(--ink);display:none;align-items:center;
  justify-content:center;padding:0 4px;line-height:1}
.badge.on{display:flex}
.badge.ok{background:var(--leaf-d)}
.dnav .badge{position:static;margin-left:2px;border-color:var(--ink)}

/* ================= views ================= */
.view{padding-top:28px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vhead{margin-bottom:4px}
.vhead h2{font-size:29px;margin:6px 0 8px}
.vhead h2 u{text-decoration:underline wavy var(--sun);text-decoration-thickness:3.5px;
  text-underline-offset:7px}
.vhead p{font-size:15px;line-height:1.62;color:var(--muted);max-width:560px}

/* progress row */
.prow{display:flex;align-items:center;flex-wrap:wrap;gap:11px;margin:20px 0 24px}
.track{flex:1;min-width:130px;height:12px;background:#F3E7D2;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));
  border-radius:999px;width:0;transition:width .3s cubic-bezier(.3,.8,.4,1)}
.track.g i{background:linear-gradient(90deg,var(--leaf),#7FD49A)}
.prow .c{font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.prow .fete{font-family:var(--disp);font-weight:700;font-size:12px;background:var(--sun);
  border:2px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap}
.prow .rst{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--muted);
  border:2px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;
  transition:border-color .15s,color .15s}
.prow .rst:not(:disabled):hover{border-color:var(--ink);color:var(--ink)}
.prow .rst:disabled{opacity:.4;cursor:default}

/* ================= tonight hero ================= */
.tonight{position:relative;display:block;width:100%;text-align:left;background:var(--coral);
  color:#FFF8EF;border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);
  padding:22px;margin-bottom:26px;overflow:hidden;
  transition:transform .18s,box-shadow .18s}
.tonight:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.tonight:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.tonight::after{content:"🍽️";position:absolute;right:-6px;bottom:-14px;font-size:74px;
  opacity:.18;transform:rotate(-10deg)}
.tonight .k{display:inline-block;background:var(--ink);color:var(--cream);font-weight:900;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.tonight .n{display:block;font-family:var(--disp);font-weight:800;font-size:23px;
  margin:11px 0 12px;line-height:1.18}
.tonight .m{display:inline-block;background:rgba(255,248,239,.94);color:var(--ink);
  font-weight:800;font-size:12.5px;padding:4px 12px;border-radius:999px}
.tonight .go{display:inline-flex;margin-top:15px;background:#FFF8EF;color:var(--coral-d);
  font-family:var(--disp);font-weight:700;font-size:12.5px;border:2px solid var(--ink);
  border-radius:999px;padding:5px 13px;box-shadow:0 2px 0 var(--ink)}
.tonight.done{background:var(--leaf-d)}
.tonight.done .go{color:var(--leaf-d)}
.tonight .ph{display:none}

/* ================= day cards ================= */
.day{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:19px;overflow:hidden;
  transition:transform .18s,box-shadow .18s,opacity .2s}
@media(hover:hover){.day:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}}
.day.now{outline:3px solid var(--sun);outline-offset:3px}
.day.done{opacity:.78}
.dhead{display:flex;align-items:stretch}
.dtoggle{flex:1;min-width:0;display:grid;grid-template-columns:64px 1fr auto;
  grid-template-areas:"thumb main main" "meta meta chev";column-gap:13px;row-gap:13px;
  align-items:center;text-align:left;padding:16px 12px 15px 15px}
.dthumb{grid-area:thumb;position:relative;width:64px;height:64px;border:2px solid var(--ink);border-radius:16px;
  background:var(--cchip);overflow:hidden;display:flex;align-items:center;justify-content:center;
  transform:rotate(-2deg);transition:transform .2s}
.day[data-open="1"] .dthumb,.dtoggle:hover .dthumb{transform:rotate(0) scale(1.04)}
.dthumb::before{content:var(--emo);font-size:26px}
.dthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dmain{grid-area:main;min-width:0}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dday{font-weight:900;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--cink)}
.dtag{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--cchip);color:var(--cink);border:1.5px solid var(--crule);
  padding:2px 9px;border-radius:999px}
.dok{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--leaf-d);color:#fff;border:1.5px solid var(--ink);
  padding:2px 9px;border-radius:999px;display:none}
.day.done .dok{display:inline-block}
.dnom{display:block;font-family:var(--disp);font-weight:800;font-size:18px;line-height:1.28;margin:8px 0 0}
.day.done .dnom{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--leaf)}
.dmeta{grid-area:meta;display:flex;gap:7px;flex-wrap:nowrap;min-width:0}
.dmeta i{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dmeta i{font-style:normal;font-weight:800;font-size:11px;border:1.5px solid var(--crule);
  color:var(--cink);padding:2px 9px;border-radius:999px;background:var(--card)}
.dmeta i.p{background:var(--cink);color:var(--card);border-color:var(--cink)}
.chev{grid-area:chev;justify-self:end;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.day[data-open="1"] .chev svg{transform:rotate(180deg)}
.dcook{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border-left:2px dashed var(--line);color:var(--muted);transition:color .15s}
.dcook:hover{color:var(--ink)}
.dcook b{width:34px;height:34px;border:2px solid currentColor;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,transform .15s}
.dcook svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}
.dcook em{font-style:normal;font-weight:800;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase}
.day.done .dcook{color:var(--leaf-d)}
.day.done .dcook b{background:var(--leaf);border-color:var(--ink);color:#fff}
.dcook.pop b{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.day[data-open="1"]{opacity:1}
.dpanel{display:none;padding:6px 18px 24px;border-top:2px dashed var(--line);margin-top:2px}
.day[data-open="1"] .dpanel{display:block}
.dimg{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border:2px solid var(--ink);
  border-radius:16px;margin-top:16px;box-shadow:var(--sh-sm)}

/* chrono bars */
.bars{display:flex;gap:5px;margin:14px 0 4px}
.bar{background:var(--cchip);border:1.5px solid var(--crule);border-radius:10px;
  padding:6px 8px;min-width:0;overflow:hidden}
.bar b{display:block;font-size:11px;font-weight:800;color:var(--cink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{font-style:normal;font-weight:700;font-size:9.5px;color:var(--cink);opacity:.75}
.par{font-size:12px;color:var(--muted);font-style:italic;margin-top:7px}
@media(max-width:560px){
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bar{display:flex;gap:8px;align-items:baseline;padding:8px 11px}
  .bar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar:last-child:nth-child(odd){grid-column:1/-1}
}
.blk{margin-top:22px}
.blk>h4{font-family:var(--body);font-weight:900;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);
  padding-bottom:8px;margin-bottom:12px}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:14px;font-size:14.5px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;
  font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--cink);
  background:var(--cchip);border:1.5px solid var(--crule);
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%}
dl.q{display:grid;grid-template-columns:1fr auto;gap:0 10px}
dl.q dt,dl.q dd{padding:8px 0;border-bottom:1.5px dotted var(--line);font-size:14px}
dl.q dd{font-family:var(--disp);font-weight:700;font-size:13px;text-align:right;white-space:nowrap}
.cookbtn{width:100%;margin-top:20px;padding:13px;border:2px solid var(--ink);border-radius:999px;
  background:var(--card);box-shadow:var(--sh-sm);font-family:var(--disp);font-weight:700;
  font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .15s,box-shadow .15s,background .15s}
.cookbtn:hover{background:#FFF1D6}
.cookbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.cookbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}
.day.done .cookbtn{background:var(--leaf-d);color:#fff}
.day.done .cookbtn:hover{background:#276B41}

/* ================= cards ================= */
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--sh);padding:22px 20px;margin-bottom:19px;transition:transform .18s,box-shadow .18s}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}}
.card h3{font-size:20px}
.card .sub{font-size:14.5px;color:var(--muted);margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pills span{font-family:var(--disp);font-weight:700;font-size:12px;border:2px solid var(--line);
  padding:3px 12px;border-radius:999px;background:var(--card)}
.kid{margin-top:14px;padding:11px 13px;border:2px dashed var(--line);border-radius:14px;
  font-size:13.5px;color:#6B594B;background:rgba(255,246,232,.6)}
.kid b{font-weight:900;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  display:block;color:var(--muted);margin-bottom:3px}
.card.hi{background:#FFF3CF}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 4px}
.legend span{font-weight:800;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;border:1.5px solid rgba(63,46,35,.25)}
.note{margin-top:26px;font-size:13.5px;color:var(--muted);line-height:1.65;max-width:560px}

/* ================= shopping ================= */
.shopbar{position:sticky;top:var(--top);z-index:30;background:rgba(255,246,232,.96);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  margin:14px -16px 0;padding:12px 16px;border-bottom:2px solid var(--ink)}
.segs{display:flex;gap:8px}
.seg{flex:1;padding:9px 6px;border:2px solid var(--ink);border-radius:999px;
  background:var(--card);font-family:var(--disp);font-weight:700;font-size:13px;
  text-align:center;transition:background .15s,transform .15s,box-shadow .15s}
.seg:active{transform:translateY(1px)}
.seg[aria-current="true"]{background:var(--sun);box-shadow:var(--sh-sm)}
.shopbar .prow{margin:12px 0 0}
.rays{margin-top:6px}
.ray{margin-top:28px;break-inside:avoid}
.ray h4{font-family:var(--disp);font-weight:700;font-size:15px;display:flex;gap:9px;
  align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px}
.ray h4 .emo{font-size:18px}
.ray h4 em{font-style:normal;margin-left:auto;font-size:11.5px;font-weight:800;
  font-family:var(--body);color:var(--muted);background:#F3E7D2;border-radius:999px;padding:2px 9px}
.it{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 4px;
  border-bottom:1.5px dashed var(--line);border-radius:8px;transition:background .12s}
.it:hover{background:rgba(255,241,214,.6)}
.box{flex:0 0 26px;height:26px;border:2px solid var(--muted);border-radius:9px;display:flex;
  align-items:center;justify-content:center;transition:background .15s,border-color .15s,transform .15s}
.it:active .box{transform:scale(.88)}
.box svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transition:opacity .15s}
.it .nm{flex:1;font-size:15px;font-weight:600}
.it .qt{font-family:var(--disp);font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}
.it[aria-pressed="true"] .box{background:var(--leaf);border-color:var(--ink)}
.it[aria-pressed="true"] .box svg{opacity:1}
.it[aria-pressed="true"] .nm{text-decoration:line-through;color:var(--muted)}
.it[aria-pressed="true"] .qt{color:var(--muted)}

/* ================= month ================= */
.mgrid .card{margin-bottom:16px}
.mrow{display:flex;gap:10px;background:var(--cbg);border:1.5px solid var(--crule);
  border-radius:12px;padding:9px 13px;margin-bottom:7px;align-items:baseline}
.mrow.done{opacity:.55}
.mrow.done .n{text-decoration:line-through}
.mrow b{font-weight:900;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cink);flex:0 0 30px;opacity:.8}
.mrow .n{flex:1;font-size:13.8px;font-weight:700;line-height:1.3}
.mrow .g{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--cink)}
.gnote{margin-top:12px;font-weight:700;font-size:12px;color:var(--muted)}

/* ================= modal ================= */
.modal{position:fixed;inset:0;z-index:80;background:rgba(63,46,35,.5);display:flex;
  align-items:flex-end;justify-content:center;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:fade .18s ease}
.modal[hidden]{display:none}
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:24px;width:100%;
  max-width:470px;padding:24px 22px 18px;box-shadow:0 6px 0 var(--ink);
  animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:21px}
.sheet p{font-size:14.5px;color:var(--muted);margin-top:9px}
.macts{display:flex;gap:9px;margin-top:22px}
.macts button{flex:1;padding:13px 8px;border-radius:999px;border:2px solid var(--ink);
  background:var(--card);box-shadow:var(--sh-sm);font-family:var(--disp);font-weight:700;
  font-size:14px;transition:transform .15s,box-shadow .15s}
.macts button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.macts .yes{background:var(--berry);border-color:var(--ink);color:#fff}
.srow{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1.5px dashed var(--line);
  width:100%;text-align:left;font-size:15px;font-weight:700;border-radius:10px;transition:background .12s}
.srow:hover{background:rgba(255,241,214,.6)}
.srow:last-of-type{border-bottom:none}
.srow svg{flex:0 0 19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.srow small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:1px}
.srow.danger{color:var(--berry)}
.srow.danger svg{color:var(--berry)}
.stat{display:block;font-family:var(--disp);font-weight:600;font-size:13px;line-height:1.7;
  background:var(--cream);border:2px dashed var(--line);border-radius:14px;
  padding:11px 14px;margin:14px 0 4px;color:var(--muted)}

/* ================= footer ================= */
.foot{max-width:660px;margin:0 auto;padding:0 16px calc(var(--nav) + 30px);
  text-align:center;font-weight:700;font-size:12.5px;color:var(--muted)}

/* ================= confetti ================= */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-14px;left:var(--x);width:9px;height:13px;border-radius:2px;
  animation:cfall var(--t) var(--d) cubic-bezier(.2,.6,.4,1) forwards;opacity:0}
@keyframes cfall{5%{opacity:1}to{transform:translateY(108vh) rotate(var(--r));opacity:.9}}

/* ================= desktop ================= */
@media(min-width:880px){
  :root{--nav:0px}
  .shell{max-width:1120px;padding:0 28px 46px}

  .tonight{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:center;

  .tonight .k,.tonight .m,.tonight .go{justify-self:start}

  .dthumb{width:88px;height:88px}

  .dcook{flex:0 0 84px}

  .dpanel{padding:6px 24px 26px}

  .b-steps{grid-area:steps}

  .b-ingr{grid-area:ingr}
  .cookbtn{grid-area:btn;max-width:420px;justify-self:center}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}

  .grid-gouter{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:start}
  .grid-gouter .card{margin-bottom:0}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .mgrid .card{margin-bottom:0}

  .shopbar{margin:14px 0 0;border:2px solid var(--ink);border-radius:18px;
    padding:14px 18px;box-shadow:var(--sh-sm)}
  .segs{max-width:520px}
  .rays{columns:2;column-gap:44px}

  .foot{padding-bottom:36px}
}
@media(max-width:400px){
  .dtoggle{column-gap:10px}
  .dmeta i{padding:2px 8px;font-size:10.5px}
}
@media(max-width:360px){
  .lname{font-size:18px}

}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

function burst(){
  const c=document.createElement('div');c.className='confetti';
  const colors=['#F4633C','#FFC64B','#3E9E63','#5FA8DC','#E2599B'];
  for(let k=0;k<28;k++){const s=document.createElement('i');
    s.style.setProperty('--x',(Math.random()*100)+'vw');
    s.style.setProperty('--d',(Math.random()*.45)+'s');
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    s.style.setProperty('--t',(0.9+Math.random()*0.8)+'s');
    s.style.background=colors[k%colors.length];
    if(k%3===0)s.style.borderRadius='50%';
    c.appendChild(s)}
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1900);
}

/* ---------------- courses ---------------- */
function listData(l){
  const s=S(), which=l||state.list;
  return which==='diners'
    ? {key:`s${s.num}.d`,groups:s.courses,foot:"Sept dîners pour trois personnes, sept gamelles pour deux, et le gâteau de la semaine."}
    : {key:`s${s.num}.b`,groups:{"Pour les 7 petits-déjeuners":D.bkCourses},
       foot:"Les œufs du petit-déjeuner s'ajoutent à ceux des dîners. Prends une boîte de 30 et tu ne compteras plus."};
}
function tally(l){
  const {groups,key}=listData(l);let tot=0,done=0;
  for(const [ray,items] of Object.entries(groups))
    items.forEach((_,i)=>{tot++;if(state.checks[`${key}|${ray}|${i}`])done++});
  return{tot,done};
}
const RAYEMO=[[/Bouch/i,'🥩'],[/Poissonnerie/i,'🐟'],[/Crémerie/i,'🥛'],[/Surgel/i,'❄️'],
  [/Fruits/i,'🥕'],[/Épicerie/i,'🫙'],[/gâteau/i,'🍰'],[/petits-déjeuners/i,'☀️']];
const rayEmo=n=>{for(const [rx,e] of RAYEMO)if(rx.test(n))return e;return '🧺'};
function viewCourses(){
  const {groups,foot,key}=listData(), {tot,done}=tally();
  let h=`<div class="vhead"><span class="eyebrow">Semaine ${S().num}</span><h2><u>Les courses</u> 🛒</h2></div>
    <div class="shopbar"><div class="segs">
      <button class="seg" data-list="diners" aria-current="${state.list==='diners'}">Dîners &amp; gamelles</button>
      <button class="seg" data-list="matin" aria-current="${state.list==='matin'}">Petits-déjeuners</button></div>
    <div class="prow"><span class="c" id="cnt">${done} / ${tot}</span>
      <span class="track"><i id="fill" style="width:${tot?done/tot*100:0}%"></i></span>
      <button class="rst" data-resetshop ${done?'':'disabled'}>Tout décocher</button></div></div><div class="rays">`;
  for(const [ray,items] of Object.entries(groups)){
    h+=`<section class="ray"><h4><span class="emo">${rayEmo(ray)}</span>${esc(ray)}<em data-raycnt></em></h4>`;
    h+=items.map(([n,q],i)=>{const id=`${key}|${ray}|${i}`,on=!!state.checks[id];
      return `<button class="it" data-id="${esc(id)}" aria-pressed="${on}">
        <span class="box">${CHK}</span><span class="nm">${esc(n)}</span><span class="qt">${esc(q)}</span></button>`}).join('');
    h+=`</section>`;
  }
  h+=`</div><p class="note">${esc(foot)}</p>`;
  return h;
}
function refreshCounts(){
  let tot=0,done=0;
  $$('.ray').forEach(sec=>{const its=$$('.it',sec);let d=0;
    its.forEach(b=>{if(b.getAttribute('aria-pressed')==='true')d++});
    sec.querySelector('[data-raycnt]').textContent=`${d}/${its.length}`;
    tot+=its.length;done+=d});
  const f=$('#fill'),c=$('#cnt'),r=$('[data-resetshop]');
  if(f)f.style.width=(tot?done/tot*100:0)+'%';
  if(c)c.textContent=`${done} / ${tot}`;
  if(r)r.disabled=!done;
  badges();
}

const VIEWS={diners:viewDiners,matin:viewMatin,gouter:viewGouter,courses:viewCourses,mois:viewMois};
function badges(){
  const shop=tally('diners');
  const left=shop.tot-shop.done;
  $$('.bshop').forEach(b=>{b.textContent=left;b.className='badge bshop'+(left?' on':'')});
  const c=cookCount(state.week);
  $$('.bcook').forEach(b=>{b.textContent=c===7?'✓':(7-c);b.className='badge bcook on'+(c===7?' ok':'')});
  D.semaines.forEach(s=>{const w=$(`.wk[data-week="${s.num}"]`);
    if(w)w.dataset.full=cookCount(s.num)===7?'1':'0'});
}

  const s=S();
  $('#wtitle').textContent=state.tab==='mois'?'Le mois entier':s.titre;
  $$('.wk').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.week===state.week)));

  $('#view').innerHTML=VIEWS[state.tab]();
  window.scrollTo({top:0});
  if(state.tab==='courses')refreshCounts(); else badges();
}
function syncTop(){const h=$('.top').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--top',Math.round(h)+'px')}

/* ---------------- sauvegarde ---------------- */
function exportState(){
  const data={v:1,date:new Date().toISOString(),checks:state.checks,cooked:state.cooked};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='menus-progression.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importState(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);
    state.checks=d.checks||{};state.cooked=d.cooked||{};save();closeModal();render();
  }catch(e){alert("Fichier illisible.")}};
  fr.readAsText(file);
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#modal') && !t.closest('.sheet')){closeModal();return}
  if(t.closest('#mno')){closeModal();return}
  if(t.closest('#myes')){const cb=pending;closeModal();if(cb)cb();return}

  const wk=t.closest('.wk');
  if(wk){state.week=+wk.dataset.week;Store.set('mn.week',state.week);render();return}
  const nb=t.closest('[data-tab]');
  if(nb){state.tab=nb.dataset.tab;render();return}
  const g=t.closest('.gear');
  if(g){openSettings();return}
  const sg=t.closest('.seg');
  if(sg){state.list=sg.dataset.list;render();return}

  const ck=t.closest('[data-cook]');
  if(ck){const i=+ck.dataset.cook,id=cookId(state.week,i);
    const marking=!state.cooked[id];
    if(state.cooked[id])delete state.cooked[id];else state.cooked[id]=1;
    save();
    const card=$(`.day[data-i="${i}"]`),was=card?card.dataset.open:'0';
    render();
    const c2=$(`.day[data-i="${i}"]`);
    if(was==='1'&&c2){c2.dataset.open='1';
      $('.dtoggle',c2).setAttribute('aria-expanded','true');
      c2.scrollIntoView({block:'center'})}
    if(marking&&c2){const dc=$('.dcook',c2);if(dc)dc.classList.add('pop')}
    if(marking&&cookCount(state.week)===7)burst();
    return}

  const rc=t.closest('[data-resetcook]');
  if(rc){const s=S();
    ask('Réinitialiser la semaine '+s.num+' ?',
        'Les '+cookCount(s.num)+' repas marqués comme cuisinés repasseront à zéro. Les recettes et les courses ne bougent pas.',
        'Réinitialiser',()=>{
          D.jours.forEach((_,i)=>delete state.cooked[cookId(s.num,i)]);save();render()});
    return}
  const rs=t.closest('[data-resetshop]');
  if(rs){const {key}=listData(),{done}=tally();
    ask('Vider la liste ?','Les '+done+' articles cochés seront décochés. Cette liste seulement, pas les repas cuisinés.',
        'Tout décocher',()=>{
          Object.keys(state.checks).forEach(k=>{if(k.startsWith(key+'|'))delete state.checks[k]});
          save();render()});
    return}

  const it=t.closest('.it');
  if(it){const id=it.dataset.id,on=it.getAttribute('aria-pressed')!=='true';
    it.setAttribute('aria-pressed',String(on));
    if(on)state.checks[id]=1;else delete state.checks[id];
    save();refreshCounts();
    if(on&&$$('.it').length&&$$('.it').every(b=>b.getAttribute('aria-pressed')==='true'))burst();
    return}
  const tg=t.closest('[data-toggle]');
  if(tg){const card=tg.closest('.day'),open=card.dataset.open==='1';
    card.dataset.open=open?'0':'1';tg.setAttribute('aria-expanded',String(!open));
    if(!open)setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),80);return}
  const jp=t.closest('[data-jump]');
  if(jp){const card=$(`.day[data-i="${jp.dataset.jump}"]`);
    if(card){card.dataset.open='1';$('.dtoggle',card).setAttribute('aria-expanded','true');
      card.scrollIntoView({behavior:'smooth',block:'start'})}}
});

/* ---------------- réglages ---------------- */
function openSettings(){
  const cooked=D.semaines.reduce((a,s)=>a+cookCount(s.num),0);
  const checks=Object.keys(state.checks).length;
  $('#mtitle').textContent='Ma progression';
  $('#mmsg').innerHTML=`<span class="stat">Sauvegarde automatique : ${Store.ok?'active sur cet appareil ✓':'indisponible dans ce navigateur'}<br>
    ${cooked} repas cuisinés · ${checks} articles cochés</span>`;
  $('#macts').innerHTML=`
    <button class="srow" id="sexp"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 20h16"/></svg>
      <span>Exporter ma progression<small>Un fichier à garder dans l'app Fichiers</small></span></button>
    <button class="srow" id="simp"><svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4M4 20h16"/></svg>
      <span>Restaurer une sauvegarde<small>Remplace l'état actuel</small></span></button>
    <button class="srow danger" id="sall"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      <span>Tout remettre à zéro<small>Les 4 semaines et toutes les listes</small></span></button>
    <button class="srow" id="sclose" style="justify-content:center;color:var(--muted);
      font-family:var(--disp);font-weight:700;font-size:13px;
      border-top:2px dashed var(--line);border-radius:0;margin-top:6px">Fermer</button>`;
  $('#macts').className='';
  $('#modal').hidden=false;pending=null;
  $('#sclose').onclick=closeModal;
  $('#sexp').onclick=exportState;
  $('#simp').onclick=()=>$('#file').click();
  $('#sall').onclick=()=>{restoreActs();
    ask('Tout remettre à zéro ?','Repas cuisinés et listes de courses des quatre semaines seront effacés. Action irréversible.',
        'Tout effacer',()=>{state.checks={};state.cooked={};save();render()})};
}
function restoreActs(){
  $('#macts').className='macts';
  $('#macts').innerHTML=`<button id="mno">Annuler</button><button id="myes" class="yes"></button>`;
}
$('#file').addEventListener('change',e=>{if(e.target.files[0])importState(e.target.files[0]);e.target.value=''});
const _ask=ask;ask=(...a)=>{restoreActs();_ask(...a)};

buildNavs();
const h0=(location.hash||'').slice(1);
if(h0&&Object.prototype.hasOwnProperty.call(VIEWS,h0))state.tab=h0;
addEventListener('resize',syncTop);syncTop();
render();
</script>
</body></html>
